services:
  - type: web
    name: bharatstore
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Optional: To attach a managed PostgreSQL on Render, uncomment the DATABASE_URL block below:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: bharatstore-db
      #     property: connectionString

# databases:
#   - name: bharatstore-db
#     databaseName: bharatstore
#     user: bharatadmin
#     plan: free
