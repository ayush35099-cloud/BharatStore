{% extends "base.html" %}

{% block title %}Create Account — BharatStore{% endblock %}

{% block content %}
<div class="container" style="padding-top: 48px; padding-bottom: 72px;">
  
  <div style="max-width: 520px; margin: 0 auto; background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 36px; box-shadow: var(--shadow-md);">
    
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo-badge-icon" style="margin: 0 auto 12px auto;">
        <i class="fa-solid fa-store"></i>
      </div>
      <h2 style="font-size: 24px; margin-bottom: 4px;">Join BharatStore</h2>
      <p style="font-size: 13px; color: var(--color-text-muted);">Access hyperlocal physical store hubs across India</p>
    </div>

    <form onsubmit="handleRegisterSubmit(event)">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Verma" required>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98000 00000" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="reg-email" class="form-control" placeholder="you@example.in" required>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>Nearest Physical Store Hub *</label>
          <select id="reg-hub" class="form-control" required>
            <option value="Mumbai">Mumbai MegaHub</option>
            <option value="Bengaluru">Bengaluru Central Hub</option>
            <option value="Delhi">Delhi NCR Hub</option>
            <option value="Hyderabad">Hyderabad Hub</option>
            <option value="Chennai">Chennai Hub</option>
            <option value="Kolkata">Kolkata Hub</option>
          </select>
        </div>
        <div class="form-group">
          <label>PIN Code *</label>
          <input type="text" id="reg-pincode" class="form-control" placeholder="6-digit PIN" maxlength="6" required>
        </div>
      </div>

      <div class="form-group">
        <label>Street Address</label>
        <input type="text" id="reg-address" class="form-control" placeholder="Apartment, building, street..." required>
      </div>

      <div class="form-group">
        <label>Create Password *</label>
        <input type="password" id="reg-password" class="form-control" placeholder="At least 8 characters" required>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14.5px; margin-bottom: 16px;">
        Create My BharatStore Account
      </button>

      <div style="text-align: center; font-size: 13px; color: var(--color-text-muted);">
        Already have an account? <a href="/login" style="color: var(--color-primary); font-weight: 700;">Sign In Instead</a>
      </div>
    </form>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  function handleRegisterSubmit(e) {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const email = document.getElementById("reg-email").value;
    const city = document.getElementById("reg-hub").value;
    const address = document.getElementById("reg-address").value;
    const phone = document.getElementById("reg-phone").value;

    localStorage.setItem("bharatstore_current_customer", JSON.stringify({
      name, email, city, address, phone
    }));
    showToast(`Account created! Welcome to BharatStore, ${name}.`);
    setTimeout(() => location.href = "/", 600);
  }
</script>
{% endblock %}
